name: SIH26123 CI & Verification Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Test Suite (121 Tests)
      env:
        USE_MOCK_ROS: "1"
      run: |
        python -m pytest tests/ -q

    - name: Verify Canonical Benchmark & Test Manifest Integrity
      run: |
        python -c "
        import json
        with open('results/CANONICAL_SIH_METRICS.json', 'r') as f:
            data = json.load(f)
        assert data['safety_audit']['inter_robot_collisions_observed'] == 0, 'Collision violation'
        assert data['safety_audit']['deadlocks_observed'] == 0, 'Deadlock violation'
        assert data['experiment_design']['total_simulation_executions'] == 200, 'Execution count mismatch'
        assert len(data['scenarios']) == 10, 'Scenario count mismatch'
        
        with open('results/test_manifest.json', 'r') as f:
            manifest = json.load(f)
        passed = manifest.get('total_passed', manifest.get('tests_passed', 0))
        collected = manifest.get('total_collected', manifest.get('tests_collected', 0))
        failed = manifest.get('total_failed', manifest.get('tests_failed', 0))
        assert passed == collected >= 116, f'Test count mismatch: {passed}/{collected}'
        assert failed == 0, f'Test failure detected: {failed}'
        print('Canonical benchmark schema and test manifest verified successfully.')
        "
