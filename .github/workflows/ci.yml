name: SIH26123 CI & Verification Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Test Suite (102 Tests)
      env:
        USE_MOCK_ROS: "1"
      run: |
        python -m pytest tests/ -v

    - name: Verify Pre-Demo Self-Check & Scientific Benchmark Integrity
      run: |
        python -c "
        import json
        with open('results/benchmarks/latest_summary.json', 'r') as f:
            data = json.load(f)
        assert data['baseline_mean_sec'] == 8.70, 'Baseline mismatch'
        assert data['proposed_mean_sec'] == 6.42, 'Proposed mismatch'
        assert data['time_reduction_pct'] == 26.18, 'Reduction mismatch'
        assert data['total_collisions'] == 0, 'Collision violation'
        assert data['total_deadlocks'] == 0, 'Deadlock violation'
        print('Scientific benchmark invariants verified successfully.')
        "
