# Benchmark Suite Configuration

benchmark:
  paired_seeds: [42, 101, 202, 303, 404, 505, 606, 707, 808, 909]
  scenarios:
    - "S0_NORMAL"
    - "S1_HIGH_CONGESTION"
    - "S2_COMM_LATENCY"
    - "S3_PACKET_LOSS"
    - "S4_AISLE_BLOCKAGE"
    - "S5_ROBOT_FAILURE"
    - "S6_TASK_SURGE"
    - "S7_COMM_AND_BLOCKAGE"
    - "S8_FAILURE_AND_CONGESTION"
    - "S9_FULL_COMBINED_DISTURBANCE"
  baselines:
    - "stop_and_wait"
    - "greedy_astar"
    - "our_system"
  ablations:
    - "no_congestion"
    - "no_fleet_allocation"
    - "no_adaptive_coordination"
    - "no_failure_recovery"
  output_dir: "results/benchmarks"
